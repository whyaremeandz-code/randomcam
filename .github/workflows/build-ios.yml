name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - build/ipa

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Build unsigned app
        run: >-
          xcodebuild
          -workspace ios/App/App.xcworkspace
          -scheme App
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package IPA
        run: |
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/App.app ipa/Payload/
          cd ipa
          /usr/bin/zip -qry ../MomentAI.ipa Payload

      - name: Package downloadable ZIP
        run: |
          mkdir -p download
          cp MomentAI.ipa download/
          cd download
          /usr/bin/zip -qry ../MomentAI-download.zip MomentAI.ipa

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MomentAI-download
          path: MomentAI-download.zip
          if-no-files-found: error
          retention-days: 7