name: Build Block World iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - build/ipa
    paths:
      - 'block-world/**'
      - '.github/workflows/build-block-world.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: block-world/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix block-world

      - name: Build web app
        run: npm --prefix block-world run build

      - name: Sync Capacitor iOS project
        run: cd block-world && npx cap sync ios

      - name: Build unsigned app
        run: >-
          xcodebuild
          -workspace block-world/ios/App/App.xcworkspace
          -scheme App
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath block-world/build
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package IPA inside ZIP
        run: |
          mkdir -p ipa/Payload
          cp -R block-world/build/Build/Products/Release-iphoneos/App.app ipa/Payload/
          cd ipa
          /usr/bin/zip -qry ../BlockWorld.ipa Payload
          cd ..
          /usr/bin/zip -qry BlockWorld-download.zip BlockWorld.ipa

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BlockWorld-download
          path: BlockWorld-download.zip
          if-no-files-found: error
          retention-days: 7